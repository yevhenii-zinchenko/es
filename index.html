<!DOCTYPE html>
<html lang="uk">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Іспанський словник</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            font-family: Inter, sans-serif;
            color: #f0e6d3
        }

        header {
            background: rgba(255, 255, 255, .05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 215, 0, .3);
            padding: 24px 20px 16px;
            text-align: center;
            top: 0;
            z-index: 10
        }

        h1 {
            font-size: clamp(20px, 5vw, 34px);
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #FFD700, #FFA500, #FF6B35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px
        }

        #counter {
            font-size: 13px;
            color: rgba(240, 230, 211, .6);
            letter-spacing: 1px
        }

        .controls {
            padding: 16px 16px 0;
            max-width: 960px;
            margin: 0 auto
        }

        #search {
            width: 100%;
            padding: 13px 18px;
            font-size: 16px;
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 215, 0, .4);
            border-radius: 12px;
            color: #f0e6d3;
            outline: none;
            margin-bottom: 12px
        }

        #search::placeholder {
            color: rgba(240, 230, 211, .4)
        }

        .cats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px
        }

        .cat-btn {
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid rgba(255, 215, 0, .3);
            background: rgba(255, 255, 255, .05);
            color: rgba(240, 230, 211, .7);
            transition: all .2s;
            font-family: inherit
        }

        .cat-btn.active {
            border-color: #FFD700;
            background: rgba(255, 215, 0, .2);
            color: #FFD700
        }

        #grid {
            display: grid;
            grid-template-columns:repeat(auto-fill, minmax(145px, 1fr));
            gap: 10px;
            padding: 16px;
            max-width: 960px;
            margin: 0 auto
        }

        .card {
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 10px;
            padding: 14px 10px;
            cursor: pointer;
            text-align: center;
            transition: all .22s;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px
        }

        .card:hover {
            background: rgba(255, 255, 255, .11)
        }

        .card.flipped {
            background: linear-gradient(135deg, rgba(255, 215, 0, .15), rgba(255, 107, 53, .15));
            border-color: rgba(255, 215, 0, .5)
        }

        .card-icon {
            font-size: 22px;
            line-height: 1
        }

        .card-es {
            font-size: 14px;
            font-weight: 600;
            color: #f0e6d3
        }

        .card-uk {
            font-size: 12px;
            color: #FFD700;
            line-height: 1.4;
            display: none
        }

        .card.flipped .card-es, .card.flipped .card-icon {
            display: none
        }

        .card.flipped .card-uk {
            display: block
        }

        #no-results {
            text-align: center;
            color: rgba(240, 230, 211, .4);
            padding: 40px;
            font-size: 16px;
            display: none
        }
    </style>
</head>
